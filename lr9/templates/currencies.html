<!doctype html>
<html>
<head><meta charset="utf-8"><title>Валюты</title></head>
<body>

<p>
    <a href="/">Главная</a> |
    <a href="/currencies">Список валют</a> |
    <a href="/author">Об авторе</a> |
    <a href="/users">Пользователи</a>
</p>

<hr>

<h2>Валюты</h2>

<table border="1">
  <tr>
    <th>ID</th><th>Num</th><th>Char</th><th>Name</th><th>Value</th><th>Nominal</th><th>Действие</th>
  </tr>

  {% for c in currencies %}
  <tr>
    <td>{{ c.id }}</td>
    <td>{{ c.num_code }}</td>
    <td>{{ c.char_code }}</td>
    <td>{{ c.name }}</td>
    <td>{{ c.value }}</td>
    <td>{{ c.nominal }}</td>
    <td>
      <a href="/currency/delete?id={{ c.id }}">Удалить</a>
    </td>
  </tr>
  {% endfor %}
    <p><a href="/currency/add_form">Добавить новую валюту</a></p>
</table>

</body>
</html>
